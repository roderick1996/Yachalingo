apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: imasmari }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: imasmari-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: imasmari }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
